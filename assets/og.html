<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0B0F0E; --surface: #131A17; --line: #26332D;
    --text: #E8F3ED; --muted: #9AB0A6;
    --jade: #2EBD8B; --mint: #9BEFCB; --gap: #0A100D; --frame: #2A382F;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: var(--sans); color: var(--text);
    background:
      radial-gradient(1100px 560px at 84% -12%, rgba(46,189,139,0.16), transparent 60%),
      radial-gradient(700px 440px at 2% 4%, rgba(155,239,203,0.07), transparent 55%),
      linear-gradient(180deg, #090C0B 0%, #0B0F0E 100%);
    -webkit-font-smoothing: antialiased;
    display: flex;
  }
  .left { width: 640px; padding: 78px 0 78px 84px; display: flex; flex-direction: column; justify-content: space-between; }
  .right { flex: 1; padding: 78px 74px 78px 40px; display: flex; flex-direction: column; justify-content: center; gap: 12px; }

  .brand { display: flex; align-items: center; gap: 20px; }
  .mark { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 20px 44px -22px rgba(0,0,0,0.8); }
  .wordmark { font-size: 60px; font-weight: 800; letter-spacing: -0.035em; }

  .headline h1 { font-size: 55px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.08; max-width: 15ch; }
  .headline .accent { color: var(--jade); }
  .headline p { margin-top: 22px; font-size: 27px; font-weight: 500; color: var(--muted); line-height: 1.35; max-width: 30ch; }

  .chips { display: flex; gap: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px; padding: 11px 19px;
    border: 1px solid var(--line); border-radius: 999px; background: rgba(19,26,23,0.55);
    font-size: 22px; font-weight: 600; color: var(--muted);
  }
  .chip .d { width: 10px; height: 10px; border-radius: 50%; background: var(--jade); }

  /* the motif: 14 stacked night strips forming the two-week grid */
  .strips { display: flex; flex-direction: column; gap: 11px; }
  .strip { position: relative; height: 20px; border-radius: 10px; background: var(--surface); border: 1px solid var(--frame); overflow: hidden; }
  .seg { position: absolute; top: 0; height: 100%; background: var(--jade); }
  .seg--mint { background: var(--mint); }
  .caption { margin-top: 18px; font-size: 20px; color: var(--muted); font-weight: 600; }
  .caption .k { color: var(--jade); }
</style>
</head>
<body>
  <div class="left">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#0B0F0E"/>
        <rect x="4" y="13" width="24" height="6" rx="3" fill="#131A17"/>
        <rect x="4" y="13" width="9"  height="6" rx="3" fill="#2EBD8B"/>
        <rect x="17" y="13" width="11" height="6" rx="3" fill="#2EBD8B"/>
      </svg>
      <span class="wordmark">sleepbook</span>
    </div>
    <div class="headline">
      <h1>The sleep diary that does the <span class="accent">arithmetic.</span></h1>
      <p>Sleep-onset latency, total sleep time &amp; sleep efficiency — for every night.</p>
    </div>
    <div class="chips">
      <span class="chip"><span class="d"></span>printable two-week grid</span>
      <span class="chip"><span class="d"></span>private &amp; offline</span>
    </div>
  </div>

  <div class="right">
    <div class="strips">
      <!-- 14 night strips; jade = asleep, ink gaps = awake -->
      <div class="strip"><span class="seg" style="left:14%;width:70%"></span><span class="seg seg--mint" style="left:86%;width:8%"></span></div>
      <div class="strip"><span class="seg" style="left:8%;width:82%"></span></div>
      <div class="strip"><span class="seg" style="left:20%;width:36%"></span><span class="seg" style="left:62%;width:26%"></span></div>
      <div class="strip"><span class="seg" style="left:6%;width:88%"></span></div>
      <div class="strip"><span class="seg" style="left:16%;width:30%"></span><span class="seg" style="left:52%;width:20%"></span><span class="seg" style="left:78%;width:14%"></span></div>
      <div class="strip"><span class="seg" style="left:10%;width:78%"></span></div>
      <div class="strip"><span class="seg" style="left:22%;width:64%"></span></div>
      <div class="strip"><span class="seg" style="left:12%;width:40%"></span><span class="seg" style="left:58%;width:30%"></span></div>
      <div class="strip"><span class="seg" style="left:6%;width:90%"></span></div>
      <div class="strip"><span class="seg" style="left:18%;width:26%"></span><span class="seg" style="left:50%;width:38%"></span></div>
      <div class="strip"><span class="seg" style="left:9%;width:80%"></span><span class="seg seg--mint" style="left:89%;width:6%"></span></div>
      <div class="strip"><span class="seg" style="left:14%;width:72%"></span></div>
      <div class="strip"><span class="seg" style="left:24%;width:32%"></span><span class="seg" style="left:60%;width:28%"></span></div>
      <div class="strip"><span class="seg" style="left:7%;width:84%"></span></div>
    </div>
    <p class="caption"><span class="k">■</span> asleep &middot; gaps = awake &middot; SE = TST / TIB × 100</p>
  </div>
</body>
</html>
