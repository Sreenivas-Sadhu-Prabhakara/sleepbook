<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0B0F0E; }
  body { display: grid; place-items: center; }
  /* 12% safe padding on each side -> mark fills the middle 76vmin */
  .mark { width: 76vmin; height: 76vmin; display: block; }
</style>
</head>
<body>
  <!-- icon = a single rounded night strip with one ink gap (the motif) -->
  <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
    <!-- track -->
    <rect x="6" y="40" width="88" height="20" rx="10" fill="#131A17"/>
    <!-- asleep (jade) with one ink gap = awake -->
    <rect x="6"  y="40" width="34" height="20" rx="10" fill="#2EBD8B"/>
    <rect x="52" y="40" width="42" height="20" rx="10" fill="#2EBD8B"/>
    <!-- mint tip to echo the highlight -->
    <rect x="82" y="40" width="12" height="20" rx="10" fill="#9BEFCB"/>
    <rect x="6" y="40" width="88" height="20" rx="10" fill="none" stroke="#2A382F" stroke-width="1.5"/>
  </svg>
</body>
</html>
